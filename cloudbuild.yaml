# Cloud Build 설정
# 자동 배포: GitHub 연동 시 push마다 실행

steps:
  # Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/develop-blog:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/develop-blog:latest'
      - '.'

  # Container Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/develop-blog:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/develop-blog:latest'

  # Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'develop-blog'
      - '--image'
      - 'gcr.io/$PROJECT_ID/develop-blog:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'  # 서울 리전
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'

images:
  - 'gcr.io/$PROJECT_ID/develop-blog:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/develop-blog:latest'

options:
  logging: CLOUD_LOGGING_ONLY
